<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>staticControl.html</title>
    <script type="module" src="./mapml.js"></script>
    <style>
      html,
      body {
        height: 100%;
      }
      * {
        margin: 0;
        padding: 0;
      }
      mapml-viewer:defined {
        max-width: 100%;
        width: 100%;
        height: 100%;
        border: none;
        vertical-align: middle;
      }
      mapml-viewer:not(:defined) > * {
        display: none;
      }
      map-layer {
        display: none;
      }
    </style>
  </head>
  <body>
    <mapml-viewer
      projection="CBMTILE"
      zoom="2"
      lat="45"
      lon="-90"
      controls
      controlslist="static"
    >
      <map-layer label="CBMT" src="tiles/cbmt/cbmt.mapml" checked></map-layer>
    </mapml-viewer>
  </body>
</html>
